services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erkan.akdag
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace_student
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
